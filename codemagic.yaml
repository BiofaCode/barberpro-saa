workflows:

  # ─────────────────────────────────────────────
  #  TEST — Build debug Android (sans signing)
  #  Objectif : valider que le projet compile
  # ─────────────────────────────────────────────
  android-debug:
    name: Android Debug (no signing)
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
        working_directory: barber_app

      - name: Analyze
        script: flutter analyze --no-fatal-warnings --no-fatal-infos
        working_directory: barber_app

      - name: Build APK debug
        script: flutter build apk --debug
        working_directory: barber_app

    artifacts:
      - barber_app/build/app/outputs/flutter-apk/app-debug.apk


  # ─────────────────────────────────────────────
  #  ANDROID — Google Play (internal test track)
  # ─────────────────────────────────────────────
  android-release:
    name: Android Release (APK + AAB)
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android_signing         # CM_KEYSTORE_BASE64, CM_KEYSTORE_PASSWORD, CM_KEY_PASSWORD
      vars:
        PACKAGE_NAME: "com.kreno.app"
        CM_KEY_ALIAS: kreno
    scripts:
      - name: Inject google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$CM_BUILD_DIR/barber_app/android/app/google-services.json"

      - name: Get Flutter packages
        script: flutter pub get
        working_directory: barber_app

      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE_BASE64 | base64 --decode > $CM_BUILD_DIR/kreno-release.keystore
          cat >> "$CM_BUILD_DIR/barber_app/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/kreno-release.keystore
          EOF

      - name: Build APK release
        script: |
          flutter build apk \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
        working_directory: barber_app

      - name: Build App Bundle
        script: |
          flutter build appbundle \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
        working_directory: barber_app

    artifacts:
      - barber_app/build/app/outputs/flutter-apk/app-release.apk
      - barber_app/build/app/outputs/bundle/release/app-release.aab


  # ─────────────────────────────────────────────
  #  iOS — TestFlight
  # ─────────────────────────────────────────────
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ch.kreno.app
      groups:
        - app_store_connect

    scripts:
      - name: Get Flutter packages
        script: flutter pub get
        working_directory: barber_app

      - name: Set up manual signing
        script: |
          python3 -c "
          import re
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          c = open(path).read()
          c = c.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          c = re.sub(
            r'([ \t]+DEVELOPMENT_TEAM = YL6QK29XDD;)',
            lambda m: m.group(0) + '\n' + re.match(r'[ \t]+', m.group(0)).group(0) + 'CODE_SIGN_STYLE = Manual;',
            c
          )
          open(path, 'w').write(c)
          "
          xcode-project use-profiles
        working_directory: barber_app

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=ios/ExportOptions.plist
        working_directory: barber_app

      - name: Inspect IPA entitlements
        script: |
          IPA=$(ls $CM_BUILD_DIR/barber_app/build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA found, skipping inspection"
            exit 0
          fi
          echo "Inspecting IPA: $IPA"
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -1)
          echo "=== ENTITLEMENTS (signed into binary) ==="
          codesign -d --entitlements :- "$APP" 2>&1 || echo "(failed to read entitlements)"
          echo ""
          echo "=== EMBEDDED PROVISIONING PROFILE ==="
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | \
            plutil -extract Entitlements xml1 -o - - 2>&1 || echo "(failed to read profile)"
          rm -rf "$WORK"

    artifacts:
      - barber_app/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Beta Testers
