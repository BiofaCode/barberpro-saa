name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Jest
        run: npx jest --forceExit
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # pinned, same as codemagic.yaml (3.50 deprecates material.dart)
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
